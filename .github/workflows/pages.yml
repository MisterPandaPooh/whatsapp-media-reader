name: Deploy latest release to Pages

# The site always serves the latest *release*, never in-progress work on main.
# Publishing a release deploys it; the manual trigger redeploys whatever the
# latest release currently is.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a half-finished one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the release to build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-$(gh release view --json tagName -q .tagName)}"
          echo "Building $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Through the environment, not `${{ }}` inline: expression expansion happens
      # before the shell parses the line, so quoting an interpolated value does not
      # contain it. Git ref rules forbid spaces but allow `" ; $ ( ) { } |` and
      # backticks, so a crafted tag name in a `run:` block is a command.
      - name: Check out that tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: git checkout --detach "$TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site lives under /<repo>/, so assets cannot be referenced from the
      # server root the way they are in dev.
      - name: Build
        run: npx vite build --base="/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
