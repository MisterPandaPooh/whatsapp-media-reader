<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WhatsApp Media Reader">
  <!--
    The product in one glyph: a grid of media tiles whose last tile is a message
    bubble — browse what was sent, open the conversation around it.

    Drawn for 16px first. Four tiles and one tail is the most that survives at
    that size, which is why there is nothing inside the tiles.

    The neutral tiles invert with the browser theme: a favicon sits on the tab
    strip, not on the page, so a single fixed grey is either invisible on white
    or invisible on near-black. The bubble only lightens — it has to stay
    recognisably the app's blue either way.
  -->
  <style>
    .tile { fill: #83888e }
    .bubble { fill: #2a75ba }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #c3c7cb }
      .bubble { fill: #5aa3ec }
    }
  </style>

  <rect class="tile" x="3.9" y="2.8" width="10.5" height="10.5" rx="2.4" />
  <rect class="tile" x="17.6" y="2.8" width="10.5" height="10.5" rx="2.4" />
  <rect class="tile" x="3.9" y="16.5" width="10.5" height="10.5" rx="2.4" />

  <g class="bubble">
    <rect x="17.6" y="16.5" width="10.5" height="10.5" rx="2.4" />
    <path d="M21.5 25 L19.3 31.3 L26 25.4 Z" />
  </g>
</svg>
